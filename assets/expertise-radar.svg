<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <radialGradient id="bgGrad">
      <stop offset="0%" style="stop-color:#0f0e3d;stop-opacity:0.2"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.05"/>
    </radialGradient>

    <linearGradient id="fillGrad">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:0.4"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="250" cy="250" r="220" fill="url(#bgGrad)"/>

  <!-- Grid circles (10 levels) -->
  <g opacity="0.2">
    <circle cx="250" cy="250" r="180" fill="none" stroke="#764ba2" stroke-width="1"/>
    <circle cx="250" cy="250" r="144" fill="none" stroke="#764ba2" stroke-width="1"/>
    <circle cx="250" cy="250" r="108" fill="none" stroke="#764ba2" stroke-width="1"/>
    <circle cx="250" cy="250" r="72" fill="none" stroke="#764ba2" stroke-width="1"/>
    <circle cx="250" cy="250" r="36" fill="none" stroke="#764ba2" stroke-width="1"/>
  </g>

  <!-- Axis lines (Pentagon - 5 axes) -->
  <g opacity="0.3">
    <!-- Machine Learning (Top) -->
    <line x1="250" y1="250" x2="250" y2="70" stroke="#667eea" stroke-width="2"/>

    <!-- Data Science (Top Right) -->
    <line x1="250" y1="250" x2="421.4" y2="138.2" stroke="#667eea" stroke-width="2"/>

    <!-- Full-Stack Dev (Bottom Right) -->
    <line x1="250" y1="250" x2="356" y2="381.8" stroke="#667eea" stroke-width="2"/>

    <!-- Cloud/MLOps (Bottom Left) -->
    <line x1="250" y1="250" x2="144" y2="381.8" stroke="#667eea" stroke-width="2"/>

    <!-- System Design (Top Left) -->
    <line x1="250" y1="250" x2="78.6" y2="138.2" stroke="#667eea" stroke-width="2"/>
  </g>

  <!-- Filled area (Proficiency levels) -->
  <g>
    <!-- Pentagon shape filled with proficiency levels -->
    <!-- ML: 90% = 162px, DS: 90% = 162px, Full-Stack: 80% = 144px, Cloud: 70% = 126px, System: 70% = 126px -->
    <polygon
      points="250,88 404.3,158.1 320.8,353.6 179.2,353.6 95.7,158.1"
      fill="url(#fillGrad)"
      stroke="#f093fb"
      stroke-width="2"
      filter="url(#glow)"
      opacity="0.8">
      <animate attributeName="opacity" values="0.7;0.9;0.7" dur="4s" repeatCount="indefinite"/>
    </polygon>

    <!-- Data points (vertices) -->
    <!-- Machine Learning - 90% -->
    <circle cx="250" cy="88" r="6" fill="#f093fb" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3s" repeatCount="indefinite"/>
    </circle>

    <!-- Data Science - 90% -->
    <circle cx="404.3" cy="158.1" r="6" fill="#f093fb" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Full-Stack Dev - 80% -->
    <circle cx="320.8" cy="353.6" r="6" fill="#764ba2" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3.4s" repeatCount="indefinite"/>
    </circle>

    <!-- Cloud/MLOps - 70% -->
    <circle cx="179.2" cy="353.6" r="6" fill="#667eea" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3.6s" repeatCount="indefinite"/>
    </circle>

    <!-- System Design - 70% -->
    <circle cx="95.7" cy="158.1" r="6" fill="#667eea" filter="url(#glow)">
      <animate attributeName="r" values="6;8;6" dur="3.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Labels -->
  <g font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff">
    <!-- Machine Learning (Top) -->
    <text x="250" y="55" text-anchor="middle">Machine Learning</text>
    <text x="250" y="70" text-anchor="middle" font-size="12" fill="#f093fb">90%</text>

    <!-- Data Science (Top Right) -->
    <text x="440" y="135" text-anchor="start">Data Science</text>
    <text x="440" y="150" text-anchor="start" font-size="12" fill="#f093fb">90%</text>

    <!-- Full-Stack Dev (Bottom Right) -->
    <text x="365" y="405" text-anchor="start">Full-Stack Dev</text>
    <text x="365" y="420" text-anchor="start" font-size="12" fill="#764ba2">80%</text>

    <!-- Cloud/MLOps (Bottom Left) -->
    <text x="135" y="405" text-anchor="end">Cloud/MLOps</text>
    <text x="135" y="420" text-anchor="end" font-size="12" fill="#667eea">70%</text>

    <!-- System Design (Top Left) -->
    <text x="60" y="135" text-anchor="end">System Design</text>
    <text x="60" y="150" text-anchor="end" font-size="12" fill="#667eea">70%</text>
  </g>

  <!-- Title -->
  <text x="250" y="30" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#f093fb" text-anchor="middle">
    Expertise Radar
  </text>

  <!-- Center decoration -->
  <circle cx="250" cy="250" r="8" fill="#764ba2" opacity="0.8">
    <animate attributeName="r" values="8;10;8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid level indicators -->
  <g font-family="Arial, sans-serif" font-size="10" fill="#764ba2" opacity="0.5">
    <text x="255" y="93">100%</text>
    <text x="255" y="129">80%</text>
    <text x="255" y="165">60%</text>
    <text x="255" y="201">40%</text>
    <text x="255" y="237">20%</text>
  </g>

  <!-- Legend -->
  <g transform="translate(150, 470)" font-family="Arial, sans-serif" font-size="11" opacity="0.7">
    <circle cx="0" cy="-5" r="4" fill="#f093fb"/>
    <text x="10" y="0" fill="#ffffff">Expert (90%+)</text>

    <circle cx="80" cy="-5" r="4" fill="#764ba2"/>
    <text x="90" y="0" fill="#ffffff">Advanced (80%)</text>

    <circle cx="170" cy="-5" r="4" fill="#667eea"/>
    <text x="180" y="0" fill="#ffffff">Proficient (70%)</text>
  </g>
</svg>
