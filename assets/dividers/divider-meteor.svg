<svg width="800" height="40" viewBox="0 0 800 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="meteorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#764ba2;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1"/>
    </linearGradient>

    <linearGradient id="trailGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0"/>
    </linearGradient>

    <filter id="meteorGlow">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Base line -->
  <line x1="0" y1="20" x2="800" y2="20" stroke="#764ba2" stroke-width="1" opacity="0.3"/>

  <!-- Meteor 1 -->
  <g opacity="0">
    <!-- Trail -->
    <path d="M -50,15 L 100,15 Q 90,20 80,20" fill="url(#trailGrad)" opacity="0.6" filter="url(#meteorGlow)"/>

    <!-- Meteor head -->
    <circle cx="0" cy="20" r="5" fill="#f093fb" filter="url(#meteorGlow)">
      <animate attributeName="r" values="5;6;5" dur="0.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-100 0"
      to="900 0"
      dur="3s"
      repeatCount="indefinite"/>

    <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Meteor 2 (delayed) -->
  <g opacity="0">
    <!-- Trail -->
    <path d="M -50,25 L 100,25 Q 90,20 80,20" fill="url(#trailGrad)" opacity="0.5" filter="url(#meteorGlow)"/>

    <!-- Meteor head -->
    <circle cx="0" cy="20" r="4" fill="#764ba2" filter="url(#meteorGlow)">
      <animate attributeName="r" values="4;5;4" dur="0.3s" repeatCount="indefinite"/>
    </circle>

    <!-- Animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-100 0"
      to="900 0"
      dur="4s"
      begin="1.5s"
      repeatCount="indefinite"/>

    <animate attributeName="opacity" values="0;1;1;0" dur="4s" begin="1.5s" repeatCount="indefinite"/>
  </g>

  <!-- Meteor 3 (smaller, faster) -->
  <g opacity="0">
    <!-- Trail -->
    <path d="M -30,18 L 60,18 Q 55,20 50,20" fill="url(#trailGrad)" opacity="0.4" filter="url(#meteorGlow)"/>

    <!-- Meteor head -->
    <circle cx="0" cy="20" r="3" fill="#667eea" filter="url(#meteorGlow)"/>

    <!-- Animation -->
    <animateTransform
      attributeName="transform"
      type="translate"
      from="-100 0"
      to="900 0"
      dur="2.5s"
      begin="3s"
      repeatCount="indefinite"/>

    <animate attributeName="opacity" values="0;1;1;0" dur="2.5s" begin="3s" repeatCount="indefinite"/>
  </g>

  <!-- Sparkle stars in background -->
  <g opacity="0.6">
    <circle cx="150" cy="12" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="350" cy="28" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="550" cy="10" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="700" cy="30" r="1" fill="#ffffff">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
