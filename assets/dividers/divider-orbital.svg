<svg width="800" height="50" viewBox="0 0 800 50" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.7"/>
    </linearGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Central line -->
  <line x1="0" y1="25" x2="800" y2="25" stroke="url(#orbitGrad)" stroke-width="2" opacity="0.4"/>

  <!-- Orbital path (ellipse) -->
  <ellipse cx="400" cy="25" rx="150" ry="15" fill="none" stroke="#764ba2" stroke-width="1.5" opacity="0.3"/>

  <!-- Orbiting object -->
  <g>
    <circle cx="0" cy="0" r="4" fill="#f093fb" filter="url(#blur)">
      <animateMotion dur="6s" repeatCount="indefinite">
        <mpath href="#orbitPath"/>
      </animateMotion>
    </circle>

    <!-- Trail effect -->
    <circle cx="0" cy="0" r="3" fill="#764ba2" opacity="0.6">
      <animateMotion dur="6s" repeatCount="indefinite" begin="0.2s">
        <mpath href="#orbitPath"/>
      </animateMotion>
    </circle>

    <circle cx="0" cy="0" r="2" fill="#667eea" opacity="0.4">
      <animateMotion dur="6s" repeatCount="indefinite" begin="0.4s">
        <mpath href="#orbitPath"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Hidden path for animation -->
  <path id="orbitPath" d="M 250,25 A 150,15 0 1,1 550,25 A 150,15 0 1,1 250,25" fill="none" opacity="0"/>

  <!-- Central star/planet -->
  <circle cx="400" cy="25" r="5" fill="#667eea" opacity="0.8">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Glow around central object -->
  <circle cx="400" cy="25" r="8" fill="none" stroke="#667eea" stroke-width="1" opacity="0.3">
    <animate attributeName="r" values="8;12;8" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
</svg>
