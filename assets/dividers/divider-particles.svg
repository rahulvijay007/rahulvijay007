<svg width="800" height="40" viewBox="0 0 800 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:0.5"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:0.5"/>
    </linearGradient>
  </defs>

  <!-- Base line -->
  <line x1="0" y1="20" x2="800" y2="20" stroke="url(#lineGrad)" stroke-width="2" opacity="0.6"/>

  <!-- Animated particles flowing along the line -->
  <circle cx="0" cy="20" r="3" fill="#667eea">
    <animate attributeName="cx" from="0" to="800" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="0" cy="20" r="2.5" fill="#764ba2">
    <animate attributeName="cx" from="0" to="800" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="0" cy="20" r="2" fill="#f093fb">
    <animate attributeName="cx" from="0" to="800" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- Additional particles for depth -->
  <circle cx="800" cy="20" r="3" fill="#f093fb">
    <animate attributeName="cx" from="800" to="0" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="8s" repeatCount="indefinite"/>
  </circle>

  <circle cx="800" cy="20" r="2.5" fill="#764ba2">
    <animate attributeName="cx" from="800" to="0" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" dur="9s" repeatCount="indefinite"/>
  </circle>

  <!-- Sparkle effects -->
  <g opacity="0.8">
    <circle cx="200" cy="15" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="500" cy="25" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="18" r="1.5" fill="#ffffff">
      <animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
