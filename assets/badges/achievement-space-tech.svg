<svg width="100" height="120" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad6">
      <stop offset="0%" style="stop-color:#764ba2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f0e3d;stop-opacity:1"/>
    </radialGradient>
    <filter id="glow6">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#764ba2" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="38;42;38" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- Main circle -->
  <circle cx="50" cy="50" r="35" fill="url(#grad6)" filter="url(#glow6)"/>

  <!-- Inner shine -->
  <circle cx="42" cy="42" r="8" fill="#ffffff" opacity="0.3"/>

  <!-- Icon: Rocket/Space -->
  <text x="50" y="60" font-size="28" text-anchor="middle" fill="#ffffff">🚀</text>

  <!-- Label -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#764ba2" text-anchor="middle">
    Space Tech
  </text>
  <text x="50" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#f093fb" text-anchor="middle">
    Enthusiast
  </text>
</svg>
