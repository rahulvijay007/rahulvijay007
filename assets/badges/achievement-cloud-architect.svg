<svg width="100" height="120" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad8">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1"/>
    </radialGradient>
    <filter id="glow8">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#667eea" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="38;42;38" dur="4.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Main circle -->
  <circle cx="50" cy="50" r="35" fill="url(#grad8)" filter="url(#glow8)"/>

  <!-- Inner shine -->
  <circle cx="42" cy="42" r="8" fill="#ffffff" opacity="0.3"/>

  <!-- Icon: Cloud -->
  <text x="50" y="60" font-size="28" text-anchor="middle" fill="#ffffff">☁️</text>

  <!-- Label -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#667eea" text-anchor="middle">
    Cloud/MLOps
  </text>
  <text x="50" y="108" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#764ba2" text-anchor="middle">
    Explorer
  </text>
</svg>
