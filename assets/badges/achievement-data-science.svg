<svg width="100" height="120" viewBox="0 0 100 120" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="grad4">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#667eea;stop-opacity:1"/>
    </radialGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- Outer glow ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="#f093fb" stroke-width="1" opacity="0.4">
    <animate attributeName="r" values="38;42;38" dur="3.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Main circle -->
  <circle cx="50" cy="50" r="35" fill="url(#grad4)" filter="url(#glow4)"/>

  <!-- Inner shine -->
  <circle cx="42" cy="42" r="8" fill="#ffffff" opacity="0.3"/>

  <!-- Icon: Chart/Analytics -->
  <text x="50" y="60" font-size="28" text-anchor="middle" fill="#ffffff">📊</text>

  <!-- Label -->
  <text x="50" y="95" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#f093fb" text-anchor="middle">
    Johns Hopkins
  </text>
  <text x="50" y="108" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#667eea" text-anchor="middle">
    Data Science
  </text>
</svg>
